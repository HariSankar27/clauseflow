name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Integration tests hit real tables; without this the schema is empty.
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      # Run the integration tests too - CI has the Postgres the dev machine lacks,
      # so this is the only place the DB layer actually gets exercised.
      - run: uv run pytest -m "not eval"
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
