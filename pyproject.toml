[project]
name = "clauseflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HariSankar27", email = "sankar.koduri27@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "docling>=2.128.0",
    "langchain>=1.4.1",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "typer>=0.26.8",
]

[project.scripts]
clauseflow = "clauseflow.cli:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs Docker services", "eval: calls real LLMs"]
